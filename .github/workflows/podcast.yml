# Terykon podcast — the production of the episodes and of the feed (19/10/2026). Lives in the PUBLIC repository GiorgioProvinciali/terykon-podcast
# (template kept in terykon-engine: cartographic/podcast/repo/; the repository's README says how it is set up). Public, so that the 20 runners of 4 vCPU are
# free; nothing private is ever written here: the text of the articles is read from the private repository terykon-engine (branch `corpus`) with a read-only
# token, and only the MP3s (release assets), the catalogue (branch `catalog`: manifest.jsonl) and the feed (Cloudflare Pages) come out.
#
#   plan   the spoken text of every article (tools/tts_texts.mjs --podcast), then tools/podcast_plan.py: full = every article (never 444), newest first;
#          incremental = only the articles without an episode or whose episode was made from another text (text_sha256 in the catalogue); the slices are
#          disjoint, balanced by words; the yearly releases are created when missing (episodes-<year>-0/1: the id's parity keeps each one under 1,000 assets).
#   make   one job per slice (max 20 at once), 4 processes of one core each (tools/podcast_episode.py --threads 1), the FULL Kokoro model (kokoro-v1.0.onnx,
#          fp32, checked by SHA-256; never the int8 one), --max-minutes 260 so that the uploads always fit in the 350 minutes; each finished episode goes to
#          its release (tools/podcast_release.py upload: the row is kept only after the upload), the rows go to an artifact. What does not fit is made by the
#          next incremental round.
#   feed   the catalogue (known rows + this round's) committed to the branch `catalog`, then tools/podcast_feed.mjs (feed.xml, cover, index) deployed to the
#          Cloudflare Pages project terykon-podcast (podcast.terykon.com/feed.xml). The enclosures are audio.terykon.com/<year>/terykon-<id>.mp3, the Worker
#          of terykon-engine cartographic/podcast/worker/ redirecting to the release asset.
#
# Secrets (Settings -> Secrets and variables -> Actions; only their names here):
#   TERYKON_ENGINE_READ       fine-grained personal access token, repository GiorgioProvinciali/terykon-engine only, Contents: Read-only (the tools, the
#                             corpus branch and who pushed it, the abstracts of the theme). Nothing else.
#   CLOUDFLARE_PODCAST_TOKEN  Cloudflare API token, Account -> Cloudflare Pages: Edit (the project terykon-podcast). Nothing else.
# Variable: CLOUDFLARE_ACCOUNT_ID (Settings -> Variables).
# Triggers: by hand (Actions -> podcast -> Run workflow: mode full for the first round), every night (incremental), or repository_dispatch
# "podcast-incremental" (sent after the corpus is refreshed). No pull_request trigger: the secrets never meet code from a fork.
name: podcast

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full (every article: the first round) or incremental (new and changed articles)"
        type: choice
        options: [incremental, full]
        default: incremental
      jobs:
        description: "at most this many parallel jobs (20 run at once on a free public repository)"
        default: "20"
      engine_ref:
        description: "the branch of terykon-engine with the tools"
        default: main
  schedule:
    - cron: "52 21 * * *" # 00:52 Kyiv in summer time (23:52 in winter): after the nightly round
  repository_dispatch:
    types: [podcast-incremental]

permissions:
  contents: read

concurrency:
  group: podcast
  cancel-in-progress: false

env:
  KOKORO_BASE: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
  KOKORO_MODEL: kokoro-v1.0.onnx
  KOKORO_MODEL_SHA256: 7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5
  KOKORO_VOICES: voices-v1.0.bin
  KOKORO_VOICES_SHA256: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
  MODE: ${{ inputs.mode || 'incremental' }}
  ENGINE_REF: ${{ inputs.engine_ref || 'main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the yearly releases
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      todo: ${{ steps.plan.outputs.todo }}
      engine_sha: ${{ steps.refs.outputs.engine_sha }}
      corpus_sha: ${{ steps.refs.outputs.corpus_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: terykon-engine (the tools)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: GiorgioProvinciali/terykon-engine
          ref: ${{ env.ENGINE_REF }}
          token: ${{ secrets.TERYKON_ENGINE_READ }}
          path: engine
          persist-credentials: false
      - name: terykon-engine, branch corpus (the articles)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: GiorgioProvinciali/terykon-engine
          ref: corpus
          token: ${{ secrets.TERYKON_ENGINE_READ }}
          path: corpus
          sparse-checkout: articles.jsonl.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - id: refs
        run: |
          echo "engine_sha=$(git -C engine rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "corpus_sha=$(git -C corpus rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # the review of 19/10/2026, R2: corpus is not signed, and a Write account of terykon-engine could change an article there
      # and have it voiced and published. The push that made the checked-out tip must be the workflows' (github-actions[bot])
      # or the owner's, else the round stops here (the make jobs read exactly this corpus_sha). The activity of the branch is
      # read with TERYKON_ENGINE_READ, which has Contents: read on terykon-engine (enough for GET /activity); the token only
      # through the environment, never in the script
      - name: who pushed the corpus (the workflows or the owner, else nothing is voiced)
        env:
          GH_TOKEN: ${{ secrets.TERYKON_ENGINE_READ }}
          CORPUS_SHA: ${{ steps.refs.outputs.corpus_sha }}
        run: |
          set -euo pipefail
          gh api "repos/GiorgioProvinciali/terykon-engine/activity?ref=refs/heads/corpus&per_page=30" > "$RUNNER_TEMP/corpus-activity.json"
          node engine/cartographic/tools/podcast_corpus_guard.mjs --activity "$RUNNER_TEMP/corpus-activity.json" --sha "$CORPUS_SHA"
      - name: the catalogue (branch catalog of this repository; empty on the first round)
        run: |
          if git fetch -q --depth 1 origin catalog 2>/dev/null; then git show FETCH_HEAD:manifest.jsonl > "$RUNNER_TEMP/known.jsonl"; else : > "$RUNNER_TEMP/known.jsonl"; fi
          echo "known episodes: $(grep -c . "$RUNNER_TEMP/known.jsonl" || true)"
      - id: plan
        run: |
          node engine/cartographic/tools/tts_texts.mjs --corpus corpus/articles.jsonl.gz --out "$RUNNER_TEMP/speak.jsonl" --podcast
          python3 engine/cartographic/tools/podcast_plan.py --speak "$RUNNER_TEMP/speak.jsonl" --known "$RUNNER_TEMP/known.jsonl" --mode "$MODE" \
            --jobs "${{ inputs.jobs || '20' }}" --parts 4 --model "$KOKORO_MODEL" >> "$GITHUB_OUTPUT"
      - name: the yearly releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(python3 engine/cartographic/tools/podcast_release.py tags --since 2022); do
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Terykon podcast — ${tag#episodes-}" --latest=false \
              --notes "Episodes of the Terykon podcast (${tag#episodes-}: year and id parity). Feed: https://podcast.terykon.com/feed.xml"
          done

  make:
    needs: plan
    if: needs.plan.outputs.todo != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write # release assets
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: GiorgioProvinciali/terykon-engine
          ref: ${{ needs.plan.outputs.engine_sha }}
          token: ${{ secrets.TERYKON_ENGINE_READ }}
          path: engine
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: GiorgioProvinciali/terykon-engine
          ref: ${{ needs.plan.outputs.corpus_sha }}
          token: ${{ secrets.TERYKON_ENGINE_READ }}
          path: corpus
          sparse-checkout: articles.jsonl.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: the voice (pinned wheels, hashes checked) and ffmpeg
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r requirements.txt
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -q libmp3lame
          ffmpeg -hide_banner -f lavfi -i "sine=d=0.1" -af aresample=resampler=soxr -ar 44100 -f null - 2>/dev/null
      - name: the model (full precision, SHA-256 checked)
        run: |
          mkdir -p "$RUNNER_TEMP/kokoro" && cd "$RUNNER_TEMP/kokoro"
          curl -fsSL --retry 5 -o "$KOKORO_MODEL" "$KOKORO_BASE/$KOKORO_MODEL"
          curl -fsSL --retry 5 -o "$KOKORO_VOICES" "$KOKORO_BASE/$KOKORO_VOICES"
          printf '%s  %s\n%s  %s\n' "$KOKORO_MODEL_SHA256" "$KOKORO_MODEL" "$KOKORO_VOICES_SHA256" "$KOKORO_VOICES" | sha256sum -c -
      - name: the episodes (4 processes, one core each)
        env:
          PARTS: ${{ matrix.parts }}
        run: |
          ids="${PARTS//|/,}"
          node engine/cartographic/tools/tts_texts.mjs --corpus corpus/articles.jsonl.gz --out "$RUNNER_TEMP/speak.jsonl" --podcast --ids "$ids"
          IFS='|' read -ra part <<< "$PARTS"
          pids=()
          for k in "${!part[@]}"; do
            python engine/cartographic/tools/podcast_episode.py --speak "$RUNNER_TEMP/speak.jsonl" --out "$RUNNER_TEMP/out/p$k" \
              --model "$RUNNER_TEMP/kokoro/$KOKORO_MODEL" --voices "$RUNNER_TEMP/kokoro/$KOKORO_VOICES" --ids "${part[$k]}" \
              --threads 1 --max-minutes 260 > "$RUNNER_TEMP/p$k.log" 2>&1 &
            pids+=($!)
          done
          status=0
          for p in "${pids[@]}"; do wait "$p" || status=1; done
          tail -n 3 "$RUNNER_TEMP"/p*.log
          exit $status
      - name: to the releases (only finished episodes; a row only after its upload)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/rows"
          dirs=$(ls -d "$RUNNER_TEMP"/out/p* 2>/dev/null || true)
          [ -n "$dirs" ] || { echo "nothing made"; exit 0; }
          python engine/cartographic/tools/podcast_release.py upload --rows "$RUNNER_TEMP/rows/rows-${{ matrix.job }}.jsonl" $dirs
          cat "$RUNNER_TEMP"/out/p*/failed.jsonl 2>/dev/null | python3 -c "import sys, json; [print('FAILED', json.loads(l)['id'], json.loads(l)['error'][:200]) for l in sys.stdin if l.strip()]" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rows-${{ matrix.job }}
          path: ${{ runner.temp }}/rows/
          retention-days: 7
          if-no-files-found: ignore

  feed:
    needs: [plan, make]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the branch catalog
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: GiorgioProvinciali/terykon-engine
          ref: ${{ needs.plan.outputs.engine_sha }}
          token: ${{ secrets.TERYKON_ENGINE_READ }}
          path: engine
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: GiorgioProvinciali/terykon-engine
          ref: ${{ needs.plan.outputs.corpus_sha }}
          token: ${{ secrets.TERYKON_ENGINE_READ }}
          path: corpus
          sparse-checkout: articles.jsonl.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rows-*
          path: ${{ runner.temp }}/rows
          merge-multiple: true
      - name: the catalogue (branch catalog)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git fetch -q --depth 1 origin catalog 2>/dev/null; then git show FETCH_HEAD:manifest.jsonl > "$RUNNER_TEMP/known.jsonl"; else : > "$RUNNER_TEMP/known.jsonl"; fi
          python3 engine/cartographic/tools/podcast_release.py merge --known "$RUNNER_TEMP/known.jsonl" --out "$RUNNER_TEMP/manifest.jsonl" "$RUNNER_TEMP/rows/*.jsonl"
          if cmp -s "$RUNNER_TEMP/known.jsonl" "$RUNNER_TEMP/manifest.jsonl"; then echo "catalogue unchanged"; exit 0; fi
          mkdir "$RUNNER_TEMP/catalog" && cd "$RUNNER_TEMP/catalog"
          git init -q && git config user.name "terykon-podcast" && git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin catalog 2>/dev/null; then git checkout -q -b catalog FETCH_HEAD; else git checkout -q --orphan catalog; fi
          cp "$RUNNER_TEMP/manifest.jsonl" manifest.jsonl
          git add manifest.jsonl
          git commit -qm "catalogue: $(grep -c . manifest.jsonl) episodes (run ${GITHUB_RUN_ID}, $MODE)"
          git push -q origin HEAD:catalog
      - name: the feed
        run: |
          node engine/cartographic/tools/podcast_feed.mjs --manifest "$RUNNER_TEMP/manifest.jsonl" --corpus corpus/articles.jsonl.gz \
            --abstracts engine/theme/terykon-safe/data/abstracts --cover engine/cartographic/podcast/feed/cover-3000.jpg --out "$RUNNER_TEMP/site"
      - name: to Cloudflare Pages (project terykon-podcast; wrangler as terykon-engine's package-lock pins it)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PODCAST_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::the secret CLOUDFLARE_PODCAST_TOKEN is missing"; exit 1; }
          cd engine/cartographic && npm ci --no-audit --no-fund
          ./node_modules/.bin/wrangler pages deploy "$RUNNER_TEMP/site" --project-name terykon-podcast --branch main --commit-dirty=true
